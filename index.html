<title>風袋計算</title>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    width: 100%; min-height: 100vh;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    overflow-x: hidden;
    padding-top: 0;
    padding-bottom: env(safe-area-inset-bottom);
    min-height: 100dvh;
  }

  /* ===== オープニング ===== */
  #opening {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center top, #1a1715 0%, #0a0908 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    cursor: pointer;
    overflow: hidden;
    font-family: -apple-system, 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  }
  #opening::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(210,177,123,0.08) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(168,140,95,0.05) 0%, transparent 60%);
    pointer-events: none;
  }
  .opening-icon {
    width: 150px; height: 150px;
    margin-bottom: 28px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow:
      0 25px 60px rgba(0,0,0,0.6),
      0 0 0 1px rgba(210,177,123,0.25),
      0 0 30px rgba(210,177,123,0.1);
    animation: floatIcon 4s ease-in-out infinite;
    display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 1;
  }
  .opening-icon img {
    width: 100%;
    height: 100%;
    display: block;
  }
  @keyframes floatIcon {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .opening-title {
    font-size: 28px; font-weight: 400; color: #e8cfa4;
    letter-spacing: 10px; margin-bottom: 10px;
    margin-left: 10px;
    position: relative; z-index: 1;
    text-shadow: 0 2px 20px rgba(210,177,123,0.3);
  }
  .opening-divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(210,177,123,0.6), transparent);
    margin: 6px 0 14px;
    position: relative; z-index: 1;
  }
  .opening-subtitle {
    font-size: 11px; color: rgba(210,177,123,0.75);
    margin-bottom: 34px; letter-spacing: 5px;
    position: relative; z-index: 1;
    font-weight: 300;
    font-family: -apple-system, sans-serif;
    text-transform: uppercase;
  }
  .opening-tap {
    font-size: 11px; color: rgba(232,207,164,0.9);
    padding: 11px 32px;
    border: 1px solid rgba(210,177,123,0.35);
    border-radius: 2px;
    background: rgba(210,177,123,0.05);
    animation: pulse 2.5s ease-in-out infinite;
    position: relative; z-index: 1;
    letter-spacing: 4px;
    font-family: -apple-system, sans-serif;
    font-weight: 400;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }

  /* ===== クロロ登場 (1回目のタップで表示。効果音を鳴らすにはタップが必要なため) ===== */
  .opening-icon, .opening-title, .opening-subtitle { transition: all 0.4s ease; }
  #opening.appear .opening-icon { width: 84px; height: 84px; border-radius: 16px; margin-bottom: 12px; animation: none; }
  #opening.appear .opening-title { font-size: 22px; margin-bottom: 4px; }
  #opening.appear .opening-subtitle { margin-bottom: 0; }
  /* 縦長の絵（SHAPE で縦長）のときは、そのぶん上のアイコンを小さくして1画面に収める */
  #opening.appear.tall-pic .opening-icon { width: 60px; height: 60px; border-radius: 12px; margin-bottom: 8px; }
  #opening.appear.tall-pic .opening-title { font-size: 20px; }
  .kuroro-scene {
    display: none;
    width: 310px; margin: 14px auto 0;
    border: 3px solid #d2b17b; border-radius: 4px;
    overflow: hidden; background: #000;
    position: relative; z-index: 1;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  }
  .kuroro-scene img { display: block; width: 100%; height: auto; aspect-ratio: 700 / 452; object-fit: cover; }
  #opening.appear .kuroro-scene { display: block; animation: encounter 0.9s steps(1) both; }
  /* 敵があらわれた時のようにチカチカ点滅して登場 */
  @keyframes encounter {
    0% { opacity: 0; } 15% { opacity: 1; } 30% { opacity: 0; } 45% { opacity: 1; }
    60% { opacity: 0; } 75%, 100% { opacity: 1; }
  }
  .dq-msgbox {
    display: none;
    width: 310px; min-height: 92px; margin: 8px auto 16px;
    padding: 10px 12px;
    background: #000; color: #f8f8f8;
    border: 3px double #f8f8f8; border-radius: 4px;
    font-family: -apple-system, 'Hiragino Sans', sans-serif;
    font-size: 14px; font-weight: 700; line-height: 1.7;
    white-space: pre-line; text-align: left;
    position: relative; z-index: 1;
  }
  #opening.appear .dq-msgbox { display: block; animation: fadeIn 0.3s ease 0.9s both; }
  .dq-msgbox .s-cross { color: #d2b17b; }
  .dq-cursor {
    display: inline-block; width: 8px; height: 13px; background: #f8f8f8;
    animation: blink 0.6s step-end infinite; vertical-align: middle; margin-left: 2px;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  /* ===== メイン ===== */
  #main {
    display: none;
    padding: 4px 10px 16px;
    padding-top: calc(env(safe-area-inset-top) + 4px);
    max-width: 400px; margin: 0 auto;
  }
  #main.active { display: block; }

  .header { text-align: center; margin-bottom: 6px; padding: 0; position: relative; min-height: 46px; }
  .header .cc-wrap { position: absolute; top: 0; left: 0; }
  .header .gh-wrap { position: absolute; top: 0; left: 62px; }

  /* === Claude Code のキャラクター（ヘッダー左上） === */
  .cc-wrap { width: 62px; height: 40px; flex-shrink: 0; display: flex; justify-content: center; }
  .cc-mascot { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; padding-top: 4px; }
  .cc-mascot svg { width: 51px; height: 34.5px; shape-rendering: crispEdges; overflow: visible; }  /* 右の約15pxはノートパソコンが出る場所。中の絵は ccTyping が描く */
  .cc-mascot .cc-label { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 7px; letter-spacing: 0.05em; color: #d97757; opacity: 0.8; white-space: nowrap; }
  /* ときどきまばたき */

  /* === GitHub のマーク（ヘッダー左上、オレンジのキャラクターの右） ===
     横には動かず、その場で：タコの足をゆらゆら・ときどき首をかしげる・ときどき目をパチッ。タップすると1回転 */
  .gh-mascot { --gh-disc: #e6edf3; --gh-cat: #0f172a; --gh-text: #c9d1d9; }   /* ← ヘッダーの背景色に合わせて変える */
  .gh-wrap { width: 50px; height: 46px; flex-shrink: 0; display: flex; justify-content: center; align-items: flex-end; margin-right: 6px; }
  .gh-mascot { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 46px; gap: 3px; text-decoration: none; }
  .gh-mascot svg { width: 24px; height: 24px; overflow: visible; }   /* オレンジのキャラクター（足先まで24px）と上下の端をそろえる */
  .gh-label { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 7px; letter-spacing: 0.05em; color: var(--gh-text); opacity: 0.8; white-space: nowrap; }
  .gh-disc, .gh-dot { fill: var(--gh-disc); }
  .gh-cat { fill: var(--gh-cat); }
  .gh-tail-line { fill: none; stroke: var(--gh-cat); stroke-width: 0.8; stroke-linecap: round; }
  .gh-all { transform-box: view-box; transform-origin: 8px 8px; }
  .gh-head { transform-box: view-box; transform-origin: 8px 10.4px; animation: gh-tilt 5s ease-in-out infinite; }
  .gh-tail { transform-box: view-box; transform-origin: 6.5px 12.35px; animation: gh-wag 1.4s ease-in-out infinite alternate; }
  /* 目はふだん見せない（ロゴと同じ顔なし）。ときどき一瞬だけ開いてパチッ */
  .gh-eyes { fill: var(--gh-disc); transform-box: fill-box; transform-origin: center; animation: gh-wink 6s 2s infinite; }
  .gh-mascot.spin .gh-all { animation: gh-spin 0.7s cubic-bezier(0.34,1.4,0.64,1); }
  /* 2つのロゴの並びをそろえる：下の文字（Claude Code / GitHub）を同じ高さにし、絵はその上に下ぞろえで置く */
  .cc-wrap { height: 46px; align-items: flex-end; }
  .cc-mascot { height: 46px; justify-content: flex-end; padding-top: 0; gap: 3px; }
  @keyframes gh-tilt { 0%,60%,100% { transform: rotate(0); } 68% { transform: rotate(-9deg); } 78% { transform: rotate(-9deg); } 86% { transform: rotate(6deg); } 92% { transform: rotate(0); } }
  @keyframes gh-wag { from { transform: rotate(-14deg); } to { transform: rotate(12deg); } }
  @keyframes gh-wink { 0%,88%,100% { transform: scaleY(0); } 90%,95% { transform: scaleY(1); } }
  @keyframes gh-spin { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.15); } 100% { transform: rotate(360deg) scale(1); } }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; color: #f1f5f9; }
  .header p { font-size: 11px; color: #94a3b8; margin-top: 2px; }

  .card {
    background: rgba(30, 41, 59, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 14px; padding: 9px 12px; margin-bottom: 6px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  .card-pallet { border-color: rgba(251, 146, 60, 0.3); }
  .card-pcase { border-color: rgba(56, 189, 248, 0.3); }

  .card-header {
    display: flex; align-items: center;
    gap: 8px; margin-bottom: 5px;
  }
  .card-icon {
    width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .card-pallet .card-icon { background: linear-gradient(135deg, #fb923c, #f97316); }
  .card-pcase .card-icon { background: linear-gradient(135deg, #38bdf8, #0ea5e9); }
  .card-icon svg { width: 18px; height: 18px; color: #fff; }
  .card-title { font-size: 15px; font-weight: 600; color: #f1f5f9; }

  .input-row {
    display: flex; align-items: center;
    gap: 8px; margin-bottom: 4px;
  }
  .input-label { font-size: 12px; color: #cbd5e1; min-width: 72px; }
  .input-unit { font-size: 12px; color: #94a3b8; margin-left: 4px; }

  /* 直接入力フィールド */
  .input-field {
    flex: 1;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 9px;
    padding: 6px 12px;

  .add-btn {

  /* ===== 合計表示 ===== */
  .result-card {

/* キャラクターの下の「Claude Code」「GitHub」の文字を太く */

<script>
  // ===== アイコン画像の使い回し (head の appIcon 1つだけを使う) =====
  //   元の PNG の左上に Claude Code のキャラクターを描き足してから使う
  (function () {
    const iconLink = document.getElementById('appIcon');
    const fav = document.createElement('link');
    fav.rel = 'icon';
    fav.type = 'image/png';
    document.head.appendChild(fav);
    const apply = (src) => {
      iconLink.href = src;
      fav.href = src;
      // オープニングの絵は、キャラクターを描き足す前の元の画像のまま（下の apply では変えない）
    };
    document.getElementById('openingImg').src = iconLink.href;
    apply(iconLink.href);

    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        // 左上に Claude Code のキャラクター（画面左上で動いているものと同じドット絵）を小さく描く
        (function(){
          var p=2, ox=18, oy=18;   // 1ドットの大きさと左上の位置（180pxアイコン、金の枠の内側）
          var px=function(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(ox+x*p,oy+y*p,w*p,h*p);};
          var o='#d97757';
          px(2,0,8,6,o); px(0,2,2,2,o); px(10,2,2,2,o);               // 体と両腕
          px(2,6,1,2,o); px(4,6,1,2,o); px(7,6,1,2,o); px(9,6,1,2,o); // 足4本
          px(3,1,1,1,'#1a1612'); px(8,1,1,1,'#1a1612');               // 目
        })();
        apply(canvas.toDataURL('image/png'));
      } catch (e) {}
    };
    img.src = iconLink.href;
  })();

  const state = {
    // entries: 合計に追加した内訳 [{ weight, count }]
    pallet: { weight: 0, count: 0, added: 0, entries: [] },
    pcase: { weight: 0, count: 0, added: 0, entries: [] },
    total: 0
  };

  const STORAGE_KEY = 'futai_keisan_v4';

  // 小数第2位で丸める (浮動小数の誤差対策)
  function round2(n) {
    return Math.round(n * 100) / 100;
  }

  // 表示用: 基本は小数第1位、第2位が必要なときだけ第2位まで
  // 例) 3.8 → "3.8"、3.75 → "3.75"、12 → "12.0"
  function fmt(n) {
    const r = round2(n);
    return Number.isInteger(r * 10) ? r.toFixed(1) : r.toFixed(2);
  }

  // ===== サウンド =====
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e) {}
    }
    return audioCtx;
  }

  function playTone(freq, duration, type = 'square', vol = 0.06) {
    try {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }

  function playSeq(notes) {
    notes.forEach((note, i) => {
      setTimeout(() => playTone(note.f, note.d || 0.08, 'square', note.v || 0.06), i * (note.gap || 70));
    });
  }

  function playOpening() {
    playSeq([
      { f: 523.25 }, { f: 659.25 }, { f: 783.99 },
      { f: 1046.50, d: 0.3 }
    ]);
  }
  function playCancel() {
    playSeq([{ f: 659.25 }, { f: 440, d: 0.1 }]);
  }
  function playAdd() {
    playSeq([
      { f: 783.99 }, { f: 1046.50 }, { f: 1318.51 }, { f: 1567.98, d: 0.2 }
    ]);
  }
  function playSave() {
    playSeq([
      { f: 1046.50 }, { f: 1318.51 }, { f: 1567.98, d: 0.25 }
    ]);
  }
  function playReset() {
    playSeq([
      { f: 783.99 }, { f: 587.33 }, { f: 392.00, d: 0.2 }
    ]);
  }
  function playError() {
    playTone(180, 0.15, 'sawtooth', 0.06);
  }
  function playOpen() { playTone(1200, 0.05, 'square', 0.04); }

  // ===== ドラクエ風の効果音 (クロロ登場用) =====
  function sq(ctx, type, freq, start, dur, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = type; o.frequency.setValueAtTime(freq, start);
    g.gain.setValueAtTime(vol, start);
    g.gain.exponentialRampToValueAtTime(0.001, start + dur);
    o.start(start); o.stop(start + dur + 0.02);
  }

}

const RICE = '#fbf8f2', NORI = '#2f3b2f', BOWL = '#c94b3c', NOODLE = '#f2d36b', STICK = '#8b5a2b', STEAM = '#c9c2bc',
      SPONGE = '#f3d9a4', BERRY = '#e0475b', LEAF = '#5aa35a', TEA = '#6b9a5b', TEA_IN = '#b7d48a';
function onigiri(x, y, bite) {                                // bite 0=まるごと 1=ひとくち 2=はんぶん 3=ひとかけ
  if (bite >= 3) return [[RICE, x + 2, y + 3, 2, 1], [NORI, x + 2, y + 4, 2, 1]];
  if (bite === 2) return [[RICE, x + 3, y + 2, 3, 1], [RICE, x + 5, y + 3, 1, 1], [NORI, x + 3, y + 3, 2, 2]];
  if (bite === 1) return [[RICE, x + 3, y + 1, 2, 1], [RICE, x + 1, y + 2, 5, 2], [NORI, x + 1, y + 3, 4, 2]];
  return [[RICE, x + 2, y, 2, 1], [RICE, x + 1, y + 1, 4, 1], [RICE, x, y + 2, 6, 2], [NORI, x + 1, y + 3, 4, 2]];
}
function ramen(x, y, left) {                                  // どんぶり（left＝残りの量 2〜0）
  const r = [[BOWL, x, y + 1, 14, 2], [BOWL, x + 1, y + 3, 12, 1], [BOWL, x + 3, y + 4, 8, 1], [RICE, x, y + 2, 14, 1]];
  if (left > 0) r.push([NOODLE, x + 1, y, 12, 1]);
  if (left > 1) r.push([NOODLE, x + 3, y - 1, 3, 1], [NOODLE, x + 8, y - 1, 3, 1]);
  return r;
}
const steam = (x, y, k) => [[STEAM, x + (k % 2), y, 1, 2], [STEAM, x + 1 - (k % 2), y - 2, 1, 2], [STEAM, x + 4 - (k % 2), y - 1, 1, 2], [STEAM, x + 3 + (k % 2), y - 3, 1, 2]];
function cake(x, y, left) {                                   // ショートケーキ（left＝残りの幅 3〜0、いちごはberryがtrueのとき）
  const r = [[RICE, x - 1, y + 5, 10, 1]];                    // おさら
  const w = [0, 3, 5, 8][left];
  if (w) r.push([RICE, x, y + 1, w, 1], [SPONGE, x, y + 2, w, 3], [RICE, x, y + 3, w, 1]);
  return r;
}
const berry = (x, y) => [[BERRY, x, y, 2, 2], [LEAF, x, y - 1, 2, 1]];
const cup = (x, y) => [[TEA, x, y, 4, 5], [TEA_IN, x, y, 4, 1], [RICE, x + 1, y + 2, 2, 1]];

// 食べたぶんを切り取る（side='left' は左から、'top' は上から）
function trim(rects, side, edge) {
  return rects.flatMap(([c, x, y, w, h]) => {
    if (side === 'left') { if (x + w <= edge) return []; const nx = Math.max(x, edge); return [[c, nx, y, w - (nx - x), h]]; }
    if (y + h <= edge) return []; const ny = Math.max(y, edge); return [[c, x, ny, w, h - (ny - y)]];
  });
}

// 手で持って食べる：持つ → 口へ → パクッ → もぐもぐ（bites 回）→ ごちそうさま
function eatHeld(sprite, W, H, side, end, extraEnd = []) {
  const at = (x, y, b) => b <= 0 ? sprite(x, y) : trim(sprite(x, y), side, side === 'left' ? x + Math.round(W * b / 3) : y + Math.round(H * b / 3));
  const rx = 16, ry = 9 - Math.max(0, H - 6), mx = 13, my = 7 - Math.round(H / 2);
  const s = [[fig({ mouth: 'closed', extra: at(rx, ry, 0) }), 650]];
  for (let b = 0; b < 3; b++) {
    s.push([fig({ r: 'up', mouth: 'open', extra: at(mx, my, b) }), 260]);
    s.push([fig({ r: 'up', mouth: 'closed', extra: at(mx, my, b + 1) }), 160]);
    for (let c = 0; c < 3; c++) s.push([fig({ eyes: 'happy', mouth: c % 2 ? 'open' : 'closed', squash: c % 2, extra: at(rx, ry, b + 1) }), 190]);
  }
  s.push([fig({ eyes: 'happy', cheek: true, mouth: 'closed', extra: [...end, ...extraEnd] }), 900], [fig({ eyes: 'happy', cheek: true }), 400]);
  return s;
}
// お皿のまま食べる：ひと口ぶん（morsel）だけ口へ運ぶ
function eatPlate(plate, morsel, end) {
  const s = [[fig({ extra: plate(0) }), 650], [fig({ eyes: 'happy', extra: [...plate(0), ...spark(-2, -2), ...spark(24, -3)] }), 450]];
  for (let b = 0; b < 3; b++) {
    s.push([fig({ r: 'up', mouth: 'open', extra: [...plate(b + 1), ...morsel] }), 280]);
    s.push([fig({ r: 'up', mouth: 'closed', extra: plate(b + 1) }), 160]);
    for (let c = 0; c < 3; c++) s.push([fig({ eyes: 'happy', mouth: c % 2 ? 'open' : 'closed', squash: c % 2, extra: plate(b + 1) }), 190]);
  }
  s.push([fig({ eyes: 'happy', cheek: true, mouth: 'closed', extra: [...plate(3), ...end] }), 900], [fig({ eyes: 'happy', cheek: true }), 400]);
  return s;
}

function dress(name, desc, cos, o = {}) {
  const arms = o.arms || 'wave';
  const s = [[fig(), 400], [fig({ eyes: 'closed', extra: poof }), 250], [fig({ eyes: 'closed', extra: [...cos(0, 0), ...poof.slice(0, 3)] }), 200]];
  for (let k = 0; k < 6; k++) {

    s.push([fig({ dy: t, eyes: o.eyes || (k % 3 === 2 ? 'closed' : 'happy'), mouth: o.mouth, dx: o.step ? (k % 2 ? 1 : -1) : 0, lift: o.stomp ? (k % 2 ? [0, 1] : [2, 3]) : [],

  for (let i = 0; i < 8; i++) {
    const s = i % 2, k = i % 4, o = COLOR.O;
    // 寝ているときは右に5マスずらして、体を下の「Claude Code」の文字の真ん中にそろえる（絵の幅34マスの真ん中＝17）
    svgOf.push('<g transform="translate(5,0)">' + rect(4, s, 16, 12 - s, o) + rect(0, s + 4, 4, 4, o) + rect(20, s + 4, 4, 4, o) +
      [4, 8, 14, 18].map(x => rect(x, 12, 2, 4, o)).join('') +
      rect(6, s * 2 + 3, 2, 1, COLOR.K) + rect(16, s * 2 + 3, 2, 1, COLOR.K) +
      zee(22, -1 - k) + (k >= 2 ? zee(26, -6 - (k - 2)) : '') + '</g>');
  }
  // 朝5時〜夜0時は、最初にパソコンを1回打ったあとは、01〜120 の動きからずっとランダムに出す。動き（見本ページの番号）からランダムに1つを1回だけ入れる
  //   入れる動きの絵は svgOf の X0 番から後ろに入れかえて使う
  const TYPE_MS = total * 1000 / 30, EVERY = 1, X0 = svgOf.length;
  let mv = null, typeOff = 0, nextAt = TYPE_MS * EVERY, done = 0, last = -1;
  const RUN = Infinity;   // 最初にパソコンを1回打ったあとは、ずっとランダムな動きを続ける
  function extraId(now) {
    if (!window.CC_EXTRA) return -1;
    if (!mv) {
      if (now < nextAt) return -1;
      let i; do { i = Math.floor(Math.random() * window.CC_EXTRA.length); } while (i === last); last = i;   // 同じ動きは続けない
      const seq = window.CC_EXTRA[i].seq;
      svgOf.length = X0;
      seq.forEach(q => svgOf.push('<g transform="translate(5,0)">' + q[0].map(([c, x, y, w, h]) => rect(x, y, w, h, c)).join('') + '</g>'));
      mv = { t0: now, seq, total: seq.reduce((s, q) => s + q[1], 0) };
    }
    let t = now - mv.t0;
    if (t >= mv.total) {   // 1回おわったら、パソコンを打つ動きを最初から（また1回打ったら次の動き）
      mv = null; done = (done + 1) % RUN;
      if (done) { nextAt = now; return extraId(now); }   // 続けて次の動き
      typeOff = Math.floor(now / (1000 / 30)); nextAt = now + TYPE_MS * EVERY; return -1;
    }
    for (let k = 0; k < mv.seq.length; k++) { if (t < mv.seq[k][1]) return X0 + k; t -= mv.seq[k][1]; }
    return X0;
  }
  function draw(now) {
    let t = (Math.floor(now / (1000 / 30)) - typeOff) % total, id = SEQ[0][0];
    for (const [f, len] of SEQ) { if (t < len) { id = f; break; } t -= len; }
    if (new Date().getHours() < 5) id = SLEEP0 + Math.floor(now / 480) % 8;   // 夜はおやすみ
    else { const x = extraId(now); if (x >= 0) id = x; }   // ときどき入る動き
    if (id !== shown) { svgs.forEach(s => { s.innerHTML = svgOf[id]; }); shown = id; }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

  // GitHub のマーク：タップするとくるっと1回転（そのあと GitHub のページが別のタブで開く）
  (function ghMascot() {
    const gh = document.querySelector('.gh-mascot');
    if (!gh) return;
    gh.addEventListener('pointerdown', function() {
      gh.classList.remove('spin'); void gh.offsetWidth; gh.classList.add('spin');
    });
    gh.addEventListener('animationend', function(e) {
      if (e.animationName === 'gh-spin') gh.classList.remove('spin');
    });
  })();
</script>
