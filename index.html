<title>風袋計算</title>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }
  html, body {
    width: 100%; min-height: 100vh;
    background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
    color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    overflow-x: hidden;
    padding-top: 0;
    padding-bottom: env(safe-area-inset-bottom);
    min-height: 100dvh;
  }

  /* ===== オープニング ===== */
  #opening {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center top, #1a1715 0%, #0a0908 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    cursor: pointer;
    overflow: hidden;
    font-family: -apple-system, 'Hiragino Mincho ProN', 'Yu Mincho', serif;
  }
  #opening::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(210,177,123,0.08) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 100%, rgba(168,140,95,0.05) 0%, transparent 60%);
    pointer-events: none;
  }
  .opening-icon {
    width: 150px; height: 150px;
    margin-bottom: 28px;
    border-radius: 24px;
    overflow: hidden;
    box-shadow:
      0 25px 60px rgba(0,0,0,0.6),
      0 0 0 1px rgba(210,177,123,0.25),
      0 0 30px rgba(210,177,123,0.1);
    animation: floatIcon 4s ease-in-out infinite;
    display: flex; align-items: center; justify-content: center;
    position: relative; z-index: 1;
  }
  .opening-icon img {
    width: 100%;
    height: 100%;
    display: block;
  }
  @keyframes floatIcon {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .opening-title {
    font-size: 28px; font-weight: 400; color: #e8cfa4;
    letter-spacing: 10px; margin-bottom: 10px;
    margin-left: 10px;
    position: relative; z-index: 1;
    text-shadow: 0 2px 20px rgba(210,177,123,0.3);
  }
  .opening-divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(210,177,123,0.6), transparent);
    margin: 6px 0 14px;
    position: relative; z-index: 1;
  }
  .opening-subtitle {
    font-size: 11px; color: rgba(210,177,123,0.75);
    margin-bottom: 34px; letter-spacing: 5px;
    position: relative; z-index: 1;
    font-weight: 300;
    font-family: -apple-system, sans-serif;
    text-transform: uppercase;
  }
  .opening-tap {
    font-size: 11px; color: rgba(232,207,164,0.9);
    padding: 11px 32px;
    border: 1px solid rgba(210,177,123,0.35);
    border-radius: 2px;
    background: rgba(210,177,123,0.05);
    animation: pulse 2.5s ease-in-out infinite;
    position: relative; z-index: 1;
    letter-spacing: 4px;
    font-family: -apple-system, sans-serif;
    font-weight: 400;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }

  /* ===== メイン ===== */
  #main {
    display: none;
    padding: 4px 10px 16px;
    padding-top: calc(env(safe-area-inset-top) + 4px);
    max-width: 400px; margin: 0 auto;
  }
  #main.active { display: block; }

  .header { text-align: center; margin-bottom: 10px; padding: 0; position: relative; min-height: 40px; }
  .header .cc-wrap { position: absolute; top: 0; left: 0; }

  /* === Claude Code のキャラクター（ヘッダー左上） === */
  .cc-wrap { width: 62px; height: 40px; flex-shrink: 0; display: flex; justify-content: center; }
  .cc-mascot { display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; padding-top: 4px; }
  .cc-mascot svg { width: 36px; height: 27px; shape-rendering: crispEdges; overflow: visible; transform-origin: center; }
  /* 歩く・立ち止まる・手足の動きは、下のスクリプト（ccMascot）で1コマずつ動かしている */
  .cc-mascot .cc-label { font-family: -apple-system, "Segoe UI", sans-serif; font-size: 7px; letter-spacing: 0.05em; color: #d97757; opacity: 0.8; white-space: nowrap; }
  .cc-body { fill: #d97757; }
  .cc-eye { fill: #1a1612; transform-box: fill-box; transform-origin: center; }
  /* ときどきまばたき */
  .cc-eye { animation: cc-blink 4s infinite; }
  @keyframes cc-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: 1px; color: #f1f5f9; }
  .header p { font-size: 11px; color: #94a3b8; margin-top: 2px; }

  .card {
    background: rgba(30, 41, 59, 0.7);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(148, 163, 184, 0.15);
    border-radius: 14px; padding: 12px; margin-bottom: 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  .card-pallet { border-color: rgba(251, 146, 60, 0.3); }
  .card-pcase { border-color: rgba(56, 189, 248, 0.3); }

  .card-header {
    display: flex; align-items: center;
    gap: 8px; margin-bottom: 8px;
  }
  .card-icon {
    width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .card-pallet .card-icon { background: linear-gradient(135deg, #fb923c, #f97316); }
  .card-pcase .card-icon { background: linear-gradient(135deg, #38bdf8, #0ea5e9); }
  .card-icon svg { width: 18px; height: 18px; color: #fff; }
  .card-title { font-size: 15px; font-weight: 600; color: #f1f5f9; }

  .input-row {
    display: flex; align-items: center;
    gap: 8px; margin-bottom: 6px;
  }
  .input-label { font-size: 12px; color: #cbd5e1; min-width: 72px; }
  .input-unit { font-size: 12px; color: #94a3b8; margin-left: 4px; }

  /* 直接入力フィールド */
  .input-field {
    flex: 1;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 9px;
    padding: 9px 12px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 4px;
    transition: border-color 0.15s;
  }
  .input-field:focus-within {
    border-color: rgba(99, 102, 241, 0.8);
    background: rgba(15, 23, 42, 0.9);
  }
  .input-value {
    flex: 1;
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #f1f5f9;
    font-size: 20px;
    font-weight: 600;
    text-align: right;
    font-feature-settings: 'tnum';
    font-variant-numeric: tabular-nums;
    font-family: inherit;
    padding: 0;
    -webkit-user-select: text;
    user-select: text;
    min-width: 0;
  }
  .input-value::placeholder { color: #475569; }

  /* この回の小計 */
  .subtotal {
    margin-top: 4px;
    padding: 7px 10px;
    background: rgba(15, 23, 42, 0.4);
    border-radius: 7px;
    font-size: 12px;
    color: #94a3b8;
    text-align: right;
    font-feature-settings: 'tnum';
    font-variant-numeric: tabular-nums;
  }
  .subtotal-value {
    color: #f1f5f9;
    font-weight: 600;
    font-size: 13px;
  }

  /* ボタン群 */
  .btn-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .add-btn {
    flex: 2;
    padding: 11px;
    border-radius: 10px;
    border: none;
    font-size: 14px; font-weight: 600;
    color: #fff;
    cursor: pointer;
    letter-spacing: 1px;
    display: flex; align-items: center; justify-content: center;
    gap: 6px;
    transition: transform 0.1s;
  }
  .add-btn:active { transform: scale(0.97); }
  .add-btn:disabled {
    opacity: 0.4; cursor: not-allowed;
  }
  .add-btn:disabled:active { transform: none; }
  .card-pallet .add-btn {
    background: linear-gradient(135deg, #fb923c, #f97316);
    box-shadow: 0 4px 14px rgba(251, 146, 60, 0.3);
  }
  .card-pcase .add-btn {
    background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
  }

  .clear-btn {
    flex: 1;
    padding: 11px;
    border-radius: 10px;
    background: rgba(15, 23, 42, 0.4);
    font-size: 12px; font-weight: 600;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
  }
  .card-pallet .clear-btn {
    border: 1px solid rgba(251, 146, 60, 0.4);
    color: #fb923c;
  }
  .card-pcase .clear-btn {
    border: 1px solid rgba(56, 189, 248, 0.4);
    color: #38bdf8;
  }
  .clear-btn:active { transform: scale(0.97); }
  .card-pallet .clear-btn:active {
    background: rgba(251, 146, 60, 0.15);
  }
  .card-pcase .clear-btn:active {
    background: rgba(56, 189, 248, 0.15);
  }
  .clear-btn:disabled {
    opacity: 0.3; cursor: not-allowed;
  }
  .clear-btn:disabled:active { transform: none; }

  /* 追加済み表示 */
  .added-info {
    margin-top: 6px;
    font-size: 11px;
    text-align: right;
    opacity: 0;
    transition: opacity 0.2s;
    min-height: 13px;
  }
  .added-info.show { opacity: 1; }
  .card-pallet .added-info { color: #fb923c; }
  .card-pcase .added-info { color: #38bdf8; }

  /* ===== 合計表示 ===== */
  .result-card {
    background: #ffffff;
    border-radius: 12px;
    padding: 5px 18px 6px;
    margin-top: 10px; margin-bottom: 8px;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    text-align: center;
    border: 1px solid rgba(255, 255, 255, 0.5);
    line-height: 1;
  }
  .result-label {
    font-size: 10px; color: #64748b;
    letter-spacing: 2px; margin-bottom: 0;
    font-weight: 600;
    line-height: 1.2;
  }
  .result-value {
    font-size: 34px; font-weight: 700; color: #0f172a;
    font-feature-settings: 'tnum';
    font-variant-numeric: tabular-nums;
    letter-spacing: -1px;
    line-height: 1;
  }
  .result-unit {
    font-size: 16px; color: #334155;
    margin-left: 4px; font-weight: 600;
  }

  /* アクション */
  .actions { display: flex; gap: 8px; margin-top: 8px; }
  .action-btn {
    flex: 1; padding: 11px;
    background: rgba(30, 41, 59, 0.7);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 10px;
    color: #cbd5e1;
    font-size: 12px; font-weight: 600;
    cursor: pointer; letter-spacing: 0.5px;
  }
  .action-btn:active { transform: scale(0.97); }
  .btn-save:active {
    background: rgba(34, 197, 94, 0.2);
    color: #4ade80;
    border-color: rgba(34, 197, 94, 0.4);
  }
  .btn-reset:active {
    background: rgba(239, 68, 68, 0.2);
    color: #f87171;
    border-color: rgba(239, 68, 68, 0.4);
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* メッセージ */
  .message {
    position: fixed; bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(30, 41, 59, 0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 12px;
    padding: 11px 22px;
    color: #f1f5f9;
    font-size: 13px;
    z-index: 3000;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .message.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @keyframes addPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }
  .result-card.pulse { animation: addPulse 0.4s ease; }

  /* ===== 確認ダイアログ ===== */
  #confirmOverlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 4000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #confirmOverlay.show { display: flex; animation: fadeIn 0.2s; }
  .confirm-box {
    width: 100%;
    max-width: 320px;
    background: #1e293b;
    border: 1px solid rgba(148, 163, 184, 0.2);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .confirm-title {
    font-size: 16px;
    font-weight: 700;
    color: #f1f5f9;
    margin-bottom: 8px;
    text-align: center;
  }
  .confirm-message {
    font-size: 13px;
    color: #cbd5e1;
    text-align: center;
    margin-bottom: 18px;
    line-height: 1.5;
  }
  .confirm-actions { display: flex; gap: 8px; }
  .confirm-btn {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .confirm-btn-cancel {
    background: rgba(51, 65, 85, 0.6);
    color: #cbd5e1;
  }
  .confirm-btn-cancel:active {
    background: rgba(51, 65, 85, 0.9);
  }
  .confirm-btn-ok {
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #fff;
    box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
  }
  .confirm-btn-ok:active { transform: scale(0.97); }
</style>
</head>
<body>

<!-- オープニング -->
<div id="opening">
  <div class="opening-icon">
    <img id="openingImg" alt="風袋計算">
  </div>
  <div class="opening-title">風袋計算</div>
  <div class="opening-divider"></div>
  <div class="opening-subtitle">Tare Weight</div>
  <div class="opening-tap">タップして開始</div>
</div>

<!-- メイン -->
<div id="main">
  <div class="header">
    <div class="cc-wrap">
      <a class="cc-mascot" href="https://claude.com/claude-code" target="_blank" rel="noopener" title="Claude Code で作成" aria-label="Claude Code で作成">
        <!-- 1マス＝1ドットのドット絵（横12×縦8マス：体6段＋足2段） -->
        <svg viewBox="0 -1 12 9" aria-hidden="true">
          <!-- 足（左から順に4本）。上げるときは高さを1マスにする -->
          <rect class="cc-body cc-leg" x="2" y="6" width="1" height="2"/>
          <rect class="cc-body cc-leg" x="4" y="6" width="1" height="2"/>
          <rect class="cc-body cc-leg" x="7" y="6" width="1" height="2"/>
          <rect class="cc-body cc-leg" x="9" y="6" width="1" height="2"/>
          <g class="cc-hop">
            <rect class="cc-body" x="2" y="0" width="8" height="6"/>
            <rect class="cc-body cc-arm-l" x="0" y="2" width="2" height="2"/>
            <rect class="cc-body cc-arm-r" x="10" y="2" width="2" height="2"/>
            <rect class="cc-eye" x="3" y="1" width="1" height="1"/>
            <rect class="cc-eye" x="8" y="1" width="1" height="1"/>
          </g>
        </svg>
        <span class="cc-label">Claude Code</span>
      </a>
    </div>
    <h1>風袋計算</h1>
    <p>パレット & Pケース</p>
  </div>

  <!-- パレット -->
  <div class="card card-pallet">
    <div class="card-header">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="6" width="20" height="4" rx="0.5"/>
          <rect x="2" y="14" width="20" height="4" rx="0.5"/>
          <line x1="6" y1="10" x2="6" y2="14"/>
          <line x1="12" y1="10" x2="12" y2="14"/>
          <line x1="18" y1="10" x2="18" y2="14"/>
        </svg>
      </div>
      <div class="card-title">パレット</div>
    </div>

    <div class="input-row">
      <span class="input-label">1台の重さ</span>
      <div class="input-field">
        <input type="text" inputmode="decimal" autocomplete="off"
               class="input-value" id="palletWeightInput" placeholder="0.0">
        <span class="input-unit">kg</span>
      </div>
    </div>

    <div class="input-row">
      <span class="input-label">台数</span>
      <div class="input-field">
        <input type="text" inputmode="numeric" autocomplete="off"
               class="input-value" id="palletCountInput" placeholder="0">
        <span class="input-unit">台</span>
      </div>
    </div>

    <div class="subtotal">
      小計: <span class="subtotal-value" id="palletSubtotal">0.0 kg</span>
    </div>

    <div class="btn-row">
      <button class="clear-btn" id="palletClearBtn" onclick="clearAdded('pallet')" disabled>
        取消
      </button>
      <button class="add-btn" id="palletAddBtn" onclick="addToTotal('pallet')">
        <span style="font-size:18px;">＋</span> 合計に追加
      </button>
    </div>

    <div class="added-info" id="palletAddedInfo"></div>
  </div>

  <!-- Pケース -->
  <div class="card card-pcase">
    <div class="card-header">
      <div class="card-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="1"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="3" y1="14" x2="21" y2="14"/>
        </svg>
      </div>
      <div class="card-title">Pケース</div>
    </div>

    <div class="input-row">
      <span class="input-label">1個の重さ</span>
      <div class="input-field">
        <input type="text" inputmode="decimal" autocomplete="off"
               class="input-value" id="pcaseWeightInput" placeholder="0.0">
        <span class="input-unit">kg</span>
      </div>
    </div>

    <div class="input-row">
      <span class="input-label">個数</span>
      <div class="input-field">
        <input type="text" inputmode="numeric" autocomplete="off"
               class="input-value" id="pcaseCountInput" placeholder="0">
        <span class="input-unit">個</span>
      </div>
    </div>

    <div class="subtotal">
      小計: <span class="subtotal-value" id="pcaseSubtotal">0.0 kg</span>
    </div>

    <div class="btn-row">
      <button class="clear-btn" id="pcaseClearBtn" onclick="clearAdded('pcase')" disabled>
        取消
      </button>
      <button class="add-btn" id="pcaseAddBtn" onclick="addToTotal('pcase')">
        <span style="font-size:18px;">＋</span> 合計に追加
      </button>
    </div>

    <div class="added-info" id="pcaseAddedInfo"></div>
  </div>

  <!-- 合計 -->
  <div class="result-card" id="resultCard">
    <div class="result-label">風袋 合計重量</div>
    <div>
      <span class="result-value" id="totalValue">0.0</span><span class="result-unit">kg</span>
    </div>
  </div>

  <div class="actions">
    <button class="action-btn btn-save" onclick="saveWeights()">重さを記憶</button>
    <button class="action-btn btn-reset" onclick="resetAll()">合計リセット</button>
  </div>
</div>

<div class="message" id="message"></div>

<!-- 確認ダイアログ -->
<div id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-title">⚠ 確認</div>
    <div class="confirm-message" id="confirmMessage">合計をリセットしますか？</div>
    <div class="confirm-actions">
      <button class="confirm-btn confirm-btn-cancel" onclick="confirmCancel()">キャンセル</button>
      <button class="confirm-btn confirm-btn-ok" onclick="confirmOk()">リセット</button>
    </div>
  </div>
</div>

<script>
  // ===== アイコン画像の使い回し (head の appIcon 1つだけを使う) =====
  //   元の PNG の左上に Claude Code のキャラクターを描き足してから使う
  (function () {
    const iconLink = document.getElementById('appIcon');
    const fav = document.createElement('link');
    fav.rel = 'icon';
    fav.type = 'image/png';
    document.head.appendChild(fav);
    const apply = (src) => {
      iconLink.href = src;
      fav.href = src;
      document.getElementById('openingImg').src = src;
    };
    apply(iconLink.href);

    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        // 左上に Claude Code のキャラクター（画面左上で動いているものと同じドット絵）を小さく描く
        (function(){
          var p=2, ox=18, oy=18;   // 1ドットの大きさと左上の位置（180pxアイコン、金の枠の内側）
          var px=function(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(ox+x*p,oy+y*p,w*p,h*p);};
          var o='#d97757';
          px(2,0,8,6,o); px(0,2,2,2,o); px(10,2,2,2,o);               // 体と両腕
          px(2,6,1,2,o); px(4,6,1,2,o); px(7,6,1,2,o); px(9,6,1,2,o); // 足4本
          px(3,1,1,1,'#1a1612'); px(8,1,1,1,'#1a1612');               // 目
        })();
        apply(canvas.toDataURL('image/png'));
      } catch (e) {}
    };
    img.src = iconLink.href;
  })();

  const state = {
    pallet: { weight: 0, count: 0, added: 0 },
    pcase: { weight: 0, count: 0, added: 0 },
    total: 0
  };

  const STORAGE_KEY = 'futai_keisan_v4';

  // 小数第2位で丸める (浮動小数の誤差対策)
  function round2(n) {
    return Math.round(n * 100) / 100;
  }

  // 表示用: 基本は小数第1位、第2位が必要なときだけ第2位まで
  // 例) 3.8 → "3.8"、3.75 → "3.75"、12 → "12.0"
  function fmt(n) {
    const r = round2(n);
    return Number.isInteger(r * 10) ? r.toFixed(1) : r.toFixed(2);
  }

  // ===== サウンド =====
  let audioCtx = null;
  function getAudioCtx() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e) {}
    }
    return audioCtx;
  }

  function playTone(freq, duration, type = 'square', vol = 0.06) {
    try {
      const ctx = getAudioCtx();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(vol, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }

  function playSeq(notes) {
    notes.forEach((note, i) => {
      setTimeout(() => playTone(note.f, note.d || 0.08, 'square', note.v || 0.06), i * (note.gap || 70));
    });
  }

  function playOpening() {
    playSeq([
      { f: 523.25 }, { f: 659.25 }, { f: 783.99 },
      { f: 1046.50, d: 0.3 }
    ]);
  }
  function playCancel() {
    playSeq([{ f: 659.25 }, { f: 440, d: 0.1 }]);
  }
  function playAdd() {
    playSeq([
      { f: 783.99 }, { f: 1046.50 }, { f: 1318.51 }, { f: 1567.98, d: 0.2 }
    ]);
  }
  function playSave() {
    playSeq([
      { f: 1046.50 }, { f: 1318.51 }, { f: 1567.98, d: 0.25 }
    ]);
  }
  function playReset() {
    playSeq([
      { f: 783.99 }, { f: 587.33 }, { f: 392.00, d: 0.2 }
    ]);
  }
  function playError() {
    playTone(180, 0.15, 'sawtooth', 0.06);
  }
  function playOpen() { playTone(1200, 0.05, 'square', 0.04); }

  // オープニング
  document.getElementById('opening').addEventListener('click', () => {
    getAudioCtx();
    playOpening();
    document.getElementById('opening').style.opacity = '0';
    document.getElementById('opening').style.transition = 'opacity 0.4s';
    setTimeout(() => {
      document.getElementById('opening').style.display = 'none';
      document.getElementById('main').classList.add('active');
      loadSavedWeights();
      setupDirectInputs();
    }, 400);
  });

  // ===== 直接入力フィールドのセットアップ =====
  function setupDirectInputs() {
    const configs = [
      { id: 'palletWeightInput', type: 'pallet', field: 'weight', decimal: true },
      { id: 'palletCountInput', type: 'pallet', field: 'count', decimal: false },
      { id: 'pcaseWeightInput', type: 'pcase', field: 'weight', decimal: true },
      { id: 'pcaseCountInput', type: 'pcase', field: 'count', decimal: false }
    ];

    configs.forEach(cfg => {
      const el = document.getElementById(cfg.id);
      if (!el || el._setup) return;
      el._setup = true;

      // 初期値を反映
      const v = state[cfg.type][cfg.field];
      el.value = v > 0 ? String(v) : '';

      // 入力イベント (即座に反映)
      el.addEventListener('input', (e) => {
        let val = e.target.value;
        if (cfg.decimal) {
          // 小数OK: 数字と「.」のみ
          val = val.replace(/[^0-9.]/g, '');
          const parts = val.split('.');
          if (parts.length > 2) {
            val = parts[0] + '.' + parts.slice(1).join('');
          }
          if (val.includes('.')) {
            const [a, b] = val.split('.');
            val = a + '.' + b.slice(0, 2);
          }
          if (val.length > 7) val = val.slice(0, 7);
        } else {
          // 整数のみ
          val = val.replace(/[^0-9]/g, '');
          if (val.length > 5) val = val.slice(0, 5);
        }

        if (e.target.value !== val) e.target.value = val;

        const num = cfg.decimal ? (parseFloat(val) || 0) : (parseInt(val, 10) || 0);
        state[cfg.type][cfg.field] = num;
        updateDisplay();
      });

      // フォーカス時に全選択(すぐ上書きできるように)
      el.addEventListener('focus', (e) => {
        setTimeout(() => e.target.select(), 50);
      });
    });
  }

  // ===== 合計に追加 =====
  function addToTotal(type) {
    const item = state[type];
    if (item.weight <= 0 || item.count <= 0) {
      playError();
      showMessage('重さと数を入力してください');
      return;
    }
    const subtotal = round2(item.weight * item.count);
    state.total = round2(state.total + subtotal);
    item.added = round2(item.added + subtotal);

    // 二重追加を防ぐため、追加したら数だけ空にする (重さは残す)
    item.count = 0;
    syncInputsFromState();

    playAdd();

    const card = document.getElementById('resultCard');
    card.classList.remove('pulse');
    void card.offsetWidth;
    card.classList.add('pulse');

    showMessage(`✓ ${fmt(subtotal)} kg を追加しました`);
    updateDisplay();
  }

  // ===== 取消 =====
  function clearAdded(type) {
    const item = state[type];
    if (item.added <= 0) return;

    const removed = item.added;
    state.total = round2(state.total - item.added);
    item.added = 0;
    if (state.total < 0.001) state.total = 0;

    playReset();

    const label = type === 'pallet' ? 'パレット' : 'Pケース';
    showMessage(`${label} ${fmt(removed)} kg を取消`);
    updateDisplay();
  }

  // ===== 表示更新 =====
  function updateDisplay() {
    const palletSubtotal = state.pallet.weight * state.pallet.count;
    const pcaseSubtotal = state.pcase.weight * state.pcase.count;
    document.getElementById('palletSubtotal').textContent = fmt(palletSubtotal) + ' kg';
    document.getElementById('pcaseSubtotal').textContent = fmt(pcaseSubtotal) + ' kg';

    document.getElementById('totalValue').textContent = fmt(state.total);

    document.getElementById('palletAddBtn').disabled = !(state.pallet.weight > 0 && state.pallet.count > 0);
    document.getElementById('pcaseAddBtn').disabled = !(state.pcase.weight > 0 && state.pcase.count > 0);

    ['pallet', 'pcase'].forEach(type => {
      const info = document.getElementById(type + 'AddedInfo');
      const clearBtn = document.getElementById(type + 'ClearBtn');
      const added = state[type].added;
      if (added > 0) {
        info.textContent = `追加済み: ${fmt(added)} kg`;
        info.classList.add('show');
        clearBtn.disabled = false;
      } else {
        info.classList.remove('show');
        info.textContent = '';
        clearBtn.disabled = true;
      }
    });
  }

  // ===== 保存/読込 =====
  function saveWeights() {
    try {
      const data = {
        palletWeight: state.pallet.weight,
        pcaseWeight: state.pcase.weight
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      playSave();
      showMessage('✓ 重さを記憶しました');
    } catch(e) {
      playError();
      showMessage('✗ 保存に失敗しました');
    }
  }

  function loadSavedWeights() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        const data = JSON.parse(saved);
        if (typeof data.palletWeight === 'number') state.pallet.weight = data.palletWeight;
        if (typeof data.pcaseWeight === 'number') state.pcase.weight = data.pcaseWeight;
        syncInputsFromState();
        updateDisplay();
      }
    } catch(e) {}
  }

  // state → 入力フィールドに値を反映
  function syncInputsFromState() {
    const map = [
      ['palletWeightInput', state.pallet.weight],
      ['palletCountInput', state.pallet.count],
      ['pcaseWeightInput', state.pcase.weight],
      ['pcaseCountInput', state.pcase.count]
    ];
    map.forEach(([id, val]) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.value = val > 0 ? String(val) : '';
    });
  }

  // ===== 確認ダイアログ =====
  let confirmCallback = null;

  function showConfirm(message, callback) {
    document.getElementById('confirmMessage').innerHTML = message;
    confirmCallback = callback;
    document.getElementById('confirmOverlay').classList.add('show');
    playOpen();
  }

  function confirmOk() {
    document.getElementById('confirmOverlay').classList.remove('show');
    if (confirmCallback) {
      const cb = confirmCallback;
      confirmCallback = null;
      cb();
    }
  }

  function confirmCancel() {
    document.getElementById('confirmOverlay').classList.remove('show');
    confirmCallback = null;
    playCancel();
  }

  // 合計と台数・個数だけをリセット (1台/1個の重さと記憶した重さは残す)
  function resetAll() {
    showConfirm(
      '合計をリセットしますか？<br>(台数・個数もクリアされます。重さはそのまま残ります)',
      () => {
        state.total = 0;
        state.pallet.count = 0;
        state.pallet.added = 0;
        state.pcase.count = 0;
        state.pcase.added = 0;

        playReset();
        syncInputsFromState();
        updateDisplay();
        showMessage('合計をリセットしました');
      }
    );
  }

  function showMessage(text) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.classList.add('show');
    clearTimeout(msg._timer);
    msg._timer = setTimeout(() => msg.classList.remove('show'), 2000);
  }

  updateDisplay();
  // 直接入力をオープニング前にもセットアップしておく
  setupDirectInputs();

  // =============================================================
  // Claude Code のキャラクター（ヘッダー左上）
  //   右へ歩く → 端で立ち止まって手足をちょこちょこ動かし、振り向く → 左へ戻る … を繰り返す
  // =============================================================
  (function ccMascot() {
    const svg = document.querySelector('.cc-mascot svg');
    if (!svg) return;
    const body = svg.querySelector('.cc-hop');
    const armL = svg.querySelector('.cc-arm-l');
    const armR = svg.querySelector('.cc-arm-r');
    const legs = Array.from(svg.querySelectorAll('.cc-leg')); // 左から順に4本

    const HALF = 12;        // 真ん中から左右それぞれに歩く幅（px）
    const STEP = 2;         // 1歩で進む距離（px）
    const TICK = 220;       // 1コマの長さ（ミリ秒）
    const IDLE_TICKS = 9;   // 端で立ち止まるコマ数

    let x = -HALF, dir = 1, mode = 'idle', t = 0;

    const legUp = (i, up) => legs[i].setAttribute('height', up ? 1 : 2);
    const armUp = (el, up) => el.setAttribute('y', up ? 1 : 2);
    const bob = up => body.setAttribute('transform', up ? 'translate(0,-1)' : '');
    const rest = () => { legs.forEach((_, i) => legUp(i, false)); armUp(armL, false); armUp(armR, false); bob(false); };
    const draw = () => { svg.style.transform = `translateX(${x}px) scaleX(${dir})`; };

    function tick() {
      t++;
      if (mode === 'walk') {
        // 歩く：外側2本と内側2本の足を交互に上げ、体も小さく弾ませる
        const ph = t % 2;
        armUp(armL, false); armUp(armR, false);
        legUp(0, ph === 0); legUp(2, ph === 0);
        legUp(1, ph === 1); legUp(3, ph === 1);
        bob(ph === 0);
        x += STEP * dir;
        if (x <= -HALF || x >= HALF) {
          x = Math.max(-HALF, Math.min(HALF, x));
          mode = 'idle'; t = 0; rest();
        }
      } else {
        // 立ち止まり：両腕を交互に上げ下げし、端の足でトントンと足踏み
        const ph = t % 4;
        armUp(armL, ph === 1);
        armUp(armR, ph === 3);
        legUp(0, ph === 2);
        legUp(3, ph === 0);
        bob(false);
        if (t === Math.floor(IDLE_TICKS / 2)) dir = (x >= HALF) ? -1 : 1; // 途中で振り向く
        if (t >= IDLE_TICKS) { mode = 'walk'; t = 0; rest(); }
      }
      draw();
    }

    draw();
    setInterval(tick, TICK);
  })();
</script>
</body>
